[package]
name = "still2video-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"           # Native window + egui immediate-mode GUI
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = "0.25"            # Image loading, resizing, cropping, Gaussian blur
imageproc = "0.25"        # Drawing shapes, arbitrary rotation, text rendering
ab_glyph = "0.2"          # TrueType font loading for the Title Screen
rfd = "0.15"              # Native OS file/folder dialogs (replaces tkinter.filedialog)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"        # Reads/writes your exact .still2video_session.json format
symphonia = { version = "0.5", features = ["all"] } # Audio decoding for waveform RMS
rayon = "1.10"            # Parallel frame rendering during export
